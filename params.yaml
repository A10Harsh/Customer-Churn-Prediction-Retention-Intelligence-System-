project:
  name: customer-retention-intelligence
  random_state: 42

data:
  raw_path: data/raw/Telco-Customer-Churn.csv
  ingested_path: data/interim/ingested.parquet
  validated_path: data/interim/validated.parquet

  development_path: data/processed/development.parquet
  test_path: data/processed/test.parquet

  quality_report_path: reports/generated/data_quality.json
  split_report_path: reports/generated/split_report.json

  target_column: Churn
  id_column: customerID
  test_size: 0.20

ingestion:
  encoding: utf-8
  strip_whitespace: true

validation:
  cv_folds: 5
  fill_zero_tenure_total_charges: true

artifacts:
  directory: artifacts

reports:
  directory: reports

eda:
  report_directory: reports/generated/eda
  numerical_features:
    - tenure
    - MonthlyCharges
    - TotalCharges
  categorical_features:
    - gender
    - SeniorCitizen
    - Partner
    - Dependents
    - PhoneService
    - MultipleLines
    - InternetService
    - OnlineSecurity
    - OnlineBackup
    - DeviceProtection
    - TechSupport
    - StreamingTV
    - StreamingMovies
    - Contract
    - PaperlessBilling
    - PaymentMethod
  rare_category_threshold: 0.01
  near_constant_dominance_threshold: 0.95
  iqr_multiplier: 1.5
  z_score_threshold: 3.0
  modified_z_score_threshold: 3.5
  percentile_bounds: [0.01, 0.99]
  strong_association_thresholds:
    numerical: 0.80
    categorical: 0.40
    target: 0.20
  minimum_segment_sample_size: 30
  tenure_boundaries: [-0.001, 6, 12, 24, 48, 72]
  mutual_information:
    n_neighbors: 3
  figures:
    dpi: 110
    width: 8.0
    height: 5.0

statistical_analysis:
  significance_level: 0.05
  fdr_threshold: 0.05
  confidence_level: 0.95
  registered_predictors:
    numerical:
      HYP-01: tenure
      HYP-02: MonthlyCharges
      HYP-03: TotalCharges
    categorical:
      HYP-04: Contract
      HYP-05: InternetService
      HYP-06: PaymentMethod
      HYP-07: TechSupport
      HYP-08: OnlineSecurity
      HYP-09: PaperlessBilling
      HYP-10a: gender
      HYP-10b: SeniorCitizen
      HYP-10c: Partner
      HYP-10d: Dependents
    confidence_segments:
      - Contract
  minimum_segment_size: 30
  vif_screening_thresholds: [5.0, 10.0]
  output_directory: reports/generated/statistical_analysis

model_training:
  models:
    logistic_regression: {max_iter: 1000, C: 1.0}
    random_forest: {n_estimators: 100, min_samples_leaf: 2, max_features: sqrt, n_jobs: 2}
    xgboost: {n_estimators: 150, max_depth: 3, learning_rate: 0.05, subsample: 0.9, colsample_bytree: 0.9, n_jobs: 2, tree_method: hist}
  feature_modes: [baseline, engineered]
  imbalance_strategies: [unweighted, weighted]
  primary_metric: average_precision
  threshold: 0.5
  mlflow_tracking_uri: sqlite:///mlflow.db
  mlflow_experiment: customer-retention-classical-ml
  report_directory: reports/generated/model_training

ann_training:
  hidden_dims: [64, 32, 16]
  dropout: 0.2
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 64
  max_epochs: 100
  early_stopping_patience: 10
  inner_validation_size: 0.2
  device: cpu
  feature_modes: [baseline, engineered]
  loss_strategies: [unweighted, weighted]
  report_directory: reports/generated/ann_training
  mlflow_experiment: customer-retention-ann
