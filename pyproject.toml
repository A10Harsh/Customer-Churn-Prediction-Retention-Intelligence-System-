[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-retention-intelligence"
version = "0.1.0"
description = "An end-to-end customer retention intelligence system."
readme = "readme.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
    "pandera[pandas]>=0.24,<1",
    "pyarrow>=18,<30",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.16,<2",
    "shap>=0.51,<0.52",
    "langchain-core>=1,<2",
    "langchain-google-genai>=4,<5",
]
[project.optional-dependencies]

dev = [
    "dvc>=3,<4",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]

analysis = [
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
]

training = [
    "xgboost>=3.2,<4",
    "mlflow>=3.18,<4",
    "matplotlib>=3.8,<4",
    "torch>=2.15,<3",
    "optuna>=4.9,<5",
    "imbalanced-learn>=0.14,<0.15",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
