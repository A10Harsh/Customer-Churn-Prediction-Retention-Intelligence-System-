[project]
name = "churn-retention-system"
version = "0.1.0"
description = "Customer churn prediction and retention system"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2,<3", "pandera[pandas]>=0.24,<1", "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4", "scikit-learn>=1.5,<2", "scipy>=1.11,<2",
    "dvc>=3,<4", "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0,<5.0",
    "pytest>=8.0,<10.0",
    "ruff==0.17.4",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "pipelines"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not integration'"
markers = ["integration: requires a local PostgreSQL service"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipelines*", "src*"]
