stages:
  ingest:
    desc: Ingest and normalize the raw customer dataset.

    cmd: python -m retention.data.ingestion

    deps:
      - ${data.raw_path}
      - src/retention/data/ingestion.py
      - src/retention/utils/config.py
      - src/retention/utils/logger.py
      - dvc/deps-data.txt

    params:
      - data.raw_path
      - data.ingested_path
      - ingestion.encoding
      - ingestion.strip_whitespace

    outs:
      - ${data.ingested_path}

  validate:
    desc: Validate dataset schema and business rules.

    cmd: python -m retention.data.validation

    deps:
      - ${data.ingested_path}
      - src/retention/data/validation.py
      - src/retention/data/schemas.py
      - src/retention/data/quality.py
      - src/retention/utils/config.py
      - src/retention/utils/logger.py
      - dvc/deps-data.txt

    params:
      - data.ingested_path
      - data.validated_path
      - data.quality_report_path
      - validation.fill_zero_tenure_total_charges

    outs:
      - ${data.validated_path}
      - ${data.quality_report_path}

  split:
    desc: Create reproducible stratified development and test datasets.

    cmd: python -m retention.data.splitting

    deps:
      - ${data.validated_path}
      - src/retention/data/splitting.py
      - src/retention/data/quality.py
      - src/retention/utils/config.py
      - src/retention/utils/logger.py
      - dvc/deps-data.txt

    params:
      - project.random_state
      - data.validated_path
      - data.development_path
      - data.test_path
      - data.split_report_path
      - data.target_column
      - data.id_column
      - data.test_size

    outs:
      - ${data.development_path}
      - ${data.test_path}
      - ${data.split_report_path}

  eda:
    desc: Generate leakage-safe automated EDA from the development split.

    cmd: python -m retention.analysis.eda

    deps:
      - ${data.development_path}
      - src/retention/analysis/__init__.py
      - src/retention/analysis/descriptive.py
      - src/retention/analysis/association.py
      - src/retention/analysis/segmentation.py
      - src/retention/analysis/outliers.py
      - src/retention/analysis/visualization.py
      - src/retention/analysis/reporting.py
      - src/retention/analysis/eda.py
      - src/retention/utils/config.py
      - src/retention/utils/logger.py
      - dvc/deps-analysis.txt

    params:
      - project.random_state
      - data.development_path
      - data.target_column
      - data.id_column
      - eda

    outs:
      - ${eda.report_directory}

  statistical_analysis:
    desc: Generate leakage-safe inferential and multicollinearity reports.

    cmd: python -m retention.analysis.statistical_analysis

    deps:
      - ${data.development_path}
      - src/retention/analysis/__init__.py
      - src/retention/analysis/association.py
      - src/retention/analysis/inference.py
      - src/retention/analysis/multiplicity.py
      - src/retention/analysis/multicollinearity.py
      - src/retention/analysis/reporting.py
      - src/retention/analysis/statistical_analysis.py
      - src/retention/utils/config.py
      - src/retention/utils/logger.py
      - dvc/deps-analysis.txt

    params:
      - project.random_state
      - data.development_path
      - data.target_column
      - data.id_column
      - eda.categorical_features
      - statistical_analysis

    outs:
      - ${statistical_analysis.output_directory}

  final_train:
    desc: Fit frozen development-only XGBoost and verify inference readiness.
    cmd: python -m retention.models.final_training
    deps:
      - ${data.development_path}
      - configs/selected_model.yaml
      - reports/generated/xgboost_enhancement/extended_trial_35_oof.csv
      - reports/generated/xgboost_enhancement/revised_selection.json
      - src/retention/models/final_training.py
      - src/retention/models/predictor.py
      - src/retention/models/factory.py
      - src/retention/models/optimization.py
      - src/retention/models/training.py
      - src/retention/features/preprocessing.py
      - src/retention/evaluation/calibration.py
      - src/retention/evaluation/metrics.py
      - params.yaml
      - dvc/deps-training.txt
    outs:
      - artifacts/final_model/predictor.joblib
      - artifacts/final_model/readiness.json

  final_evaluate:
    desc: Evaluate only the frozen ready artifact on held-out customers.
    cmd: python -m retention.evaluation.final_evaluation
    deps:
      - artifacts/final_model/predictor.joblib
      - artifacts/final_model/readiness.json
      - ${data.test_path}
      - src/retention/evaluation/final_evaluation.py
      - src/retention/models/predictor.py
      - params.yaml
      - dvc/deps-training.txt
    outs:
      - reports/generated/final_evaluation
